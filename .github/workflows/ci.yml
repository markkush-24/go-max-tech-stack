name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.8"
          cache: true

      - name: Install tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0

      - name: Check formatting
        run: |
          test -z "$(gofmt -l cmd internal)"

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Run race tests
        run: go test -race ./...

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Build binary for vuln scan
        run: go build -o .artifacts/pet-study ./cmd/api

      - name: Run govulncheck
        run: govulncheck -mode binary .artifacts/pet-study
