name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

env:
  GO_VERSION: "1.25.12"
  PROTOC_VERSION: "34.0"

jobs:
  clean-checkout:
    name: clean checkout drift gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Install protoc
        run: |
          curl -fsSLo /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          unzip -q /tmp/protoc.zip -d "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/protoc" --version

      - name: Install pinned Go tools
        shell: pwsh
        run: ./scripts/install-tools.ps1

      - name: Verify clean checkout
        shell: pwsh
        run: ./scripts/check-clean-checkout.ps1

  checks:
    needs: clean-checkout
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Install pinned Go tools
        run: |
          GOVULNCHECK_VERSION="$(go -C tools list -m -f '{{.Version}}' golang.org/x/vuln)"
          STATICCHECK_VERSION="$(go -C tools list -m -f '{{.Version}}' honnef.co/go/tools)"
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"

      - name: Check formatting
        run: |
          test -z "$(gofmt -l cmd internal scripts)"

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Run race tests
        run: go test -race ./...

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Build binary for vuln scan
        run: go build -o .artifacts/pet-study ./cmd/api

      - name: Run govulncheck
        run: govulncheck -mode binary .artifacts/pet-study
